<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L10 5L0 9z" fill="#475569"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L10 5L0 9z" fill="#34d399"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L10 5L0 9z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="42" fill="#f1f5f9" font-size="22" font-weight="700">ProjectSync Architecture</text>
  <text x="40" y="64" fill="#64748b" font-size="12">Google ADK 2.0 Graph Workflow  |  gemini-3.5-flash  |  Firestore  |  React 19 + FastAPI</text>

  <!-- ====== PHASE 1 COLUMN ====== -->
  <text x="60" y="108" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="0.5">PHASE 1 — AGENT PIPELINE</text>

  <!-- Node 1 -->
  <g transform="translate(60,120)">
    <rect width="320" height="46" rx="6" fill="#1e293b" stroke="#334155" filter="url(#s)"/>
    <circle cx="20" cy="23" r="10" fill="#0369a1"/><text x="16" y="27" fill="#fff" font-size="10" font-weight="700">1</text>
    <text x="40" y="21" fill="#f1f5f9" font-size="12" font-weight="600">scan_github_repository</text>
    <text x="40" y="37" fill="#64748b" font-size="10">Code  |  GitHub REST API, 40-file / 400KB cap</text>
  </g>
  <line x1="220" y1="166" x2="220" y2="182" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Node 2 -->
  <g transform="translate(60,182)">
    <rect width="320" height="46" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" filter="url(#s)"/>
    <circle cx="20" cy="23" r="10" fill="#7c3aed"/><text x="16" y="27" fill="#fff" font-size="10" font-weight="700">2</text>
    <text x="40" y="21" fill="#f1f5f9" font-size="12" font-weight="600">extraction_agent</text>
    <text x="40" y="37" fill="#a78bfa" font-size="10">Gemini 3.5 Flash  T:0.2  |  ExtractedMetadata</text>
  </g>
  <line x1="220" y1="228" x2="220" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Node 3 -->
  <g transform="translate(60,244)">
    <rect width="320" height="46" rx="6" fill="#1e293b" stroke="#334155" filter="url(#s)"/>
    <circle cx="20" cy="23" r="10" fill="#0369a1"/><text x="16" y="27" fill="#fff" font-size="10" font-weight="700">3</text>
    <text x="40" y="21" fill="#f1f5f9" font-size="12" font-weight="600">attach_style_rules</text>
    <text x="40" y="37" fill="#64748b" font-size="10">Code  |  Reads ACTIVE rules from Firestore</text>
  </g>
  <line x1="220" y1="290" x2="220" y2="306" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Node 4 -->
  <g transform="translate(60,306)">
    <rect width="320" height="56" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" filter="url(#s)"/>
    <circle cx="20" cy="28" r="10" fill="#7c3aed"/><text x="16" y="32" fill="#fff" font-size="10" font-weight="700">4</text>
    <text x="40" y="21" fill="#f1f5f9" font-size="12" font-weight="600">asset_generator_agent</text>
    <text x="40" y="37" fill="#a78bfa" font-size="10">Gemini 3.5 Flash  T:0.7  |  GeneratedAssets</text>
    <text x="40" y="51" fill="#64748b" font-size="9">Doc sheet, portfolio card, resume bullets, social post</text>
  </g>
  <line x1="220" y1="362" x2="220" y2="378" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Node 5 -->
  <g transform="translate(60,378)">
    <rect width="320" height="46" rx="6" fill="#1e293b" stroke="#334155" filter="url(#s)"/>
    <circle cx="20" cy="23" r="10" fill="#0369a1"/><text x="16" y="27" fill="#fff" font-size="10" font-weight="700">5</text>
    <text x="40" y="21" fill="#f1f5f9" font-size="12" font-weight="600">select_evaluator_input</text>
    <text x="40" y="37" fill="#64748b" font-size="10">Code  |  Routes repo facts (not drafts) to evaluator</text>
  </g>
  <line x1="220" y1="424" x2="220" y2="440" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Node 6 -->
  <g transform="translate(60,440)">
    <rect width="320" height="46" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" filter="url(#s)"/>
    <circle cx="20" cy="23" r="10" fill="#7c3aed"/><text x="16" y="27" fill="#fff" font-size="10" font-weight="700">6</text>
    <text x="40" y="21" fill="#f1f5f9" font-size="12" font-weight="600">path_evaluator_agent</text>
    <text x="40" y="37" fill="#a78bfa" font-size="10">Gemini 3.5 Flash  T:0.0  |  FULL_PUBLISH or PRIVATE_ONLY</text>
  </g>
  <line x1="220" y1="486" x2="220" y2="502" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Node 7 -->
  <g transform="translate(60,502)">
    <rect width="320" height="46" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#s)"/>
    <circle cx="20" cy="23" r="10" fill="#059669"/><text x="16" y="27" fill="#fff" font-size="10" font-weight="700">7</text>
    <text x="40" y="21" fill="#f1f5f9" font-size="12" font-weight="600">persist_transaction</text>
    <text x="40" y="37" fill="#34d399" font-size="10">Code  |  Saves PENDING_APPROVAL to Firestore</text>
  </g>

  <!-- Pause label -->
  <rect x="135" y="562" width="170" height="24" rx="12" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4"/>
  <text x="155" y="578" fill="#fbbf24" font-size="10" font-weight="600">Pauses for human review</text>

  <!-- ====== PHASE 2 COLUMN ====== -->
  <text x="480" y="108" fill="#10b981" font-size="13" font-weight="700" letter-spacing="0.5">PHASE 2 — REVIEW AND MEMORY</text>

  <!-- Review Desk -->
  <g transform="translate(480,120)">
    <rect width="260" height="80" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#s)"/>
    <text x="16" y="22" fill="#60a5fa" font-size="12" font-weight="700">React 19 Review Desk</text>
    <text x="16" y="40" fill="#cbd5e1" font-size="10">Edit 4 drafts, regenerate single tabs</text>
    <text x="16" y="56" fill="#cbd5e1" font-size="10">Toggle voice rules on/off</text>
    <text x="16" y="72" fill="#cbd5e1" font-size="10">Approve or Reject decision</text>
  </g>

  <!-- GitHub commit -->
  <g transform="translate(780,120)">
    <rect width="260" height="80" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#s)"/>
    <text x="16" y="22" fill="#34d399" font-size="12" font-weight="700">GitHub Commit (on Approve)</text>
    <text x="16" y="40" fill="#cbd5e1" font-size="10">docs/synced/project.md</text>
    <text x="16" y="56" fill="#cbd5e1" font-size="10">cards/project.json</text>
    <text x="16" y="72" fill="#94a3b8" font-size="10">Target: PORTFOLIO_DATA_REPO</text>
  </g>
  <line x1="740" y1="160" x2="780" y2="160" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Curator Agent -->
  <g transform="translate(480,225)">
    <rect width="260" height="55" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" filter="url(#s)"/>
    <text x="16" y="22" fill="#c084fc" font-size="12" font-weight="700">curator_agent</text>
    <text x="16" y="40" fill="#a78bfa" font-size="10">Gemini 3.5 Flash  |  Learns from your edits</text>
    <text x="16" y="52" fill="#64748b" font-size="9">Proposes new voice style rules</text>
  </g>
  <!-- Arrow from Review Desk to Curator -->
  <line x1="610" y1="200" x2="610" y2="225" stroke="#c084fc" stroke-width="1.5" marker-end="url(#ap)"/>

  <!-- Connect Phase 1 out to Phase 2 Review Desk -->
  <path d="M 380 525 H 430 V 160 H 480" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5" marker-end="url(#a)"/>

  <!-- ====== BOTTOM: INFRASTRUCTURE ====== -->
  <text x="480" y="330" fill="#64748b" font-size="13" font-weight="700" letter-spacing="0.5">INFRASTRUCTURE</text>

  <!-- Firestore -->
  <g transform="translate(480,345)">
    <rect width="290" height="90" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#s)"/>
    <text x="16" y="22" fill="#fbbf24" font-size="12" font-weight="700">Google Cloud Firestore (nam5)</text>
    <text x="16" y="42" fill="#f1f5f9" font-size="11">Episodic memory</text>
    <text x="155" y="42" fill="#94a3b8" font-size="10">projectsync_transactions</text>
    <text x="16" y="60" fill="#f1f5f9" font-size="11">Semantic memory</text>
    <text x="155" y="60" fill="#94a3b8" font-size="10">style_rules</text>
    <text x="16" y="80" fill="#f1f5f9" font-size="11">Bullet bank</text>
    <text x="155" y="80" fill="#94a3b8" font-size="10">resume_bullets</text>
  </g>

  <!-- GenAI SDK -->
  <g transform="translate(800,345)">
    <rect width="240" height="90" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#s)"/>
    <text x="16" y="22" fill="#c084fc" font-size="12" font-weight="700">Google GenAI SDK</text>
    <text x="16" y="42" fill="#cbd5e1" font-size="10">google-adk 2.7.0</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="10">google-genai (Gemini API)</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">Pydantic output_schema validation</text>
  </g>

  <!-- Curator arrow to Firestore -->
  <line x1="610" y1="280" x2="610" y2="345" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#ap)"/>

  <!-- Firestore loop back to attach_style_rules -->
  <path d="M 480 390 H 430 V 267 H 380" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#a)"/>
  <text x="400" y="310" fill="#fbbf24" font-size="9" transform="rotate(-90, 400, 310)">rules feed back</text>

  <!-- ====== LEGEND ====== -->
  <g transform="translate(60,620)">
    <rect width="380" height="70" rx="6" fill="#131b2e" stroke="#1e293b"/>
    <text x="16" y="20" fill="#64748b" font-size="10" font-weight="700">LEGEND</text>
    <circle cx="24" cy="38" r="6" fill="#7c3aed"/><text x="36" y="42" fill="#a78bfa" font-size="10">Gemini LLM Agent Node</text>
    <circle cx="160" cy="38" r="6" fill="#0369a1"/><text x="172" y="42" fill="#38bdf8" font-size="10">Python Code Node</text>
    <circle cx="290" cy="38" r="6" fill="#059669"/><text x="302" y="42" fill="#34d399" font-size="10">Persistence Node</text>
    <line x1="20" y1="58" x2="50" y2="58" stroke="#475569" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="58" y="62" fill="#64748b" font-size="10">Async / feedback loop</text>
    <line x1="180" y1="58" x2="210" y2="58" stroke="#475569" stroke-width="1.5"/>
    <text x="218" y="62" fill="#64748b" font-size="10">Synchronous flow</text>
  </g>
</svg>
