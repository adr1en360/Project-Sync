[project]
name = "projectsync"
version = "0.1.0"
description = "Turns a finished GitHub repository into career-ready outputs with one human approval."
readme = "README.md"
# The Dockerfile runs python:3.12-slim, which is the version that is installed
# on this machine. Keep the two the same. A difference between them hides an
# error until deploy.
requires-python = ">=3.12,<3.13"

dependencies = [
    "google-adk>=2.7.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "google-cloud-firestore>=2.19.0",
    "PyGithub>=2.5.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

# Name the rules here. Ruff has a different default set in each version, so a
# check with no list gives a different result on a different machine. This list
# holds the families that this code uses, and `BLE` makes each `noqa: BLE001` in
# the code do work.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "PIE", "PLW", "RUF", "FURB"]

# FastAPI puts Query, Path, Body, and Depends in an argument default on purpose.
# These calls make no shared mutable state, so B008 does not apply to them.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.File",
]
