[project]
name = "projectsync"
version = "0.1.0"
description = "Turns a finished GitHub repository into career-ready outputs with one human approval."
readme = "README.md"
# The Dockerfile runs python:3.12-slim, which is the version that is installed
# on this machine. Keep the two the same. A difference between them hides an
# error until deploy.
requires-python = ">=3.12,<3.13"

dependencies = [
    "google-adk>=2.7.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "google-cloud-firestore>=2.19.0",
    "PyGithub>=2.5.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
